<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Formação CIPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Conceito: painel de sinalização industrial. Azul-petróleo como base, laranja de sinalização só para ação, verde CIPA para progresso e aprovação. Trilha vertical como uma rota de estações. */
:root{
  --bg:#EDF1F3; --paper:#FFFFFF; --sunk:#F5F8F9; --ink:#10233A; --ink2:#4A5D6E; --ink3:#7C8D9A; --line:#D5DEE3;
  --navy:#10233A; --navy2:#1A3552; --on-navy:#E9F0F5; --on-navy2:#9FB4C6;
  --sig:#EE6A1F; --sig-ink:#FFFFFF; --sig-soft:#FDE8DB;
  --go:#0B6836; --go2:#13A05A; --go-soft:#DDF1E6;
  --err:#C23A2E; --err-soft:#FBE3E0; --warn:#9A6A00; --warn-soft:#FFF1CC;
  --ilu-a:#10233A; --ilu-b:#EE6A1F; --ilu-b2:#C9540F; --ilu-c:#B9C9D4; --ilu-c2:#7E98AB; --ilu-d:#FFFFFF; --ilu-e:#DCE5EA;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --f-body:"Figtree","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",Consolas,monospace;
  --r:14px; --sh:0 1px 2px rgba(16,35,58,.06),0 6px 20px -8px rgba(16,35,58,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1520; --paper:#112131; --sunk:#0D1B28; --ink:#E6EEF3; --ink2:#A2B4C2; --ink3:#71879A; --line:#223A4E;
  --navy:#0E2135; --navy2:#16304A; --on-navy:#E6EEF3; --on-navy2:#8FA7BA;
  --sig:#FF8340; --sig-ink:#1A0E05; --sig-soft:#3A2214; --go:#35C27A; --go2:#35C27A; --go-soft:#10301F;
  --err:#FF7466; --err-soft:#3A1916; --warn:#F2C14E; --warn-soft:#3A2E10;
  --ilu-a:#DCE7EF; --ilu-b:#FF8340; --ilu-b2:#E0692A; --ilu-c:#3A566C; --ilu-c2:#5F7D93; --ilu-d:#18324A; --ilu-e:#27435A;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1520; --paper:#112131; --sunk:#0D1B28; --ink:#E6EEF3; --ink2:#A2B4C2; --ink3:#71879A; --line:#223A4E;
  --navy:#0E2135; --navy2:#16304A; --on-navy:#E6EEF3; --on-navy2:#8FA7BA;
  --sig:#FF8340; --sig-ink:#1A0E05; --sig-soft:#3A2214; --go:#35C27A; --go2:#35C27A; --go-soft:#10301F;
  --err:#FF7466; --err-soft:#3A1916; --warn:#F2C14E; --warn-soft:#3A2E10;
  --ilu-a:#DCE7EF; --ilu-b:#FF8340; --ilu-b2:#E0692A; --ilu-c:#3A566C; --ilu-c2:#5F7D93; --ilu-d:#18324A; --ilu-e:#27435A;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sig);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.02em}
.eyebrow{font:600 12px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ilustrações */
.ilu{width:100%;height:auto;display:block}
.ilu .a{fill:var(--ilu-a)}.ilu .b{fill:var(--ilu-b)}.ilu .b2{fill:var(--ilu-b2)}.ilu .c{fill:var(--ilu-c)}.ilu .c2{fill:var(--ilu-c2)}.ilu .d{fill:var(--ilu-d)}.ilu .e{fill:var(--ilu-e)}
.ilu .ln{stroke:var(--ilu-c2)}.ilu .ln-a{stroke:var(--ilu-a)}.ilu .ln-b{stroke:var(--ilu-b)}.ilu .tx-b{fill:var(--ilu-b);font-family:var(--f-disp);font-weight:800}

/* topo */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--on-navy);display:flex;align-items:center;gap:12px;padding:10px max(16px,calc((100vw - 1160px)/2))}
.bar img{width:38px;height:38px;flex:none}
.bar .marca{line-height:1.1}
.bar .marca b{font:700 20px/1 var(--f-disp);letter-spacing:.02em;display:block}
.bar .marca span{font-size:12px;color:var(--on-navy2)}
.bar .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:transparent;color:var(--on-navy);display:grid;place-items:center}
.ibtn:hover{background:rgba(255,255,255,.08)}
.userchip{display:flex;align-items:center;gap:10px;padding:4px 4px 4px 12px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px}
.userchip b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.userchip small{color:var(--on-navy2)}
.userchip button{border:0;background:rgba(255,255,255,.1);color:var(--on-navy);border-radius:999px;padding:6px 12px;font-size:13px}
.modo{font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy2);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:2px}

main{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;background:var(--sig);color:var(--sig-ink);transition:transform .12s,filter .12s,background .12s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--navy);color:var(--on-navy)}
.btn.lin{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.lin:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.btn.go{background:var(--go);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.danger{background:transparent;color:var(--err);box-shadow:inset 0 0 0 1.5px var(--err)}
.btn:disabled{background:var(--line);color:var(--ink3);cursor:not-allowed;filter:none;box-shadow:none}
.btn svg{width:18px;height:18px}

/* formulários */
.campo{display:grid;gap:6px}
.campo label{font-weight:600;font-size:14px}
.campo input,.campo select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);outline:none;transition:border-color .15s,box-shadow .15s}
.campo input:focus,.campo select:focus,textarea:focus{border-color:var(--sig);box-shadow:0 0 0 4px var(--sig-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.aviso{padding:11px 14px;border-radius:12px;font-size:14px}
.aviso.err{background:var(--err-soft);color:var(--err)}.aviso.ok{background:var(--go-soft);color:var(--go)}.aviso.in{background:var(--warn-soft);color:var(--warn)}

/* login */
.entrada{display:grid;grid-template-columns:1.15fr 1fr;gap:0;border-radius:22px;overflow:hidden;box-shadow:var(--sh);background:var(--paper)}
.entrada .intro{background:var(--navy);color:var(--on-navy);padding:36px 36px 0;display:flex;flex-direction:column;gap:14px;position:relative}
.entrada .intro .eyebrow{color:#FFB48A}
.entrada h1{font:800 clamp(40px,6vw,64px)/.92 var(--f-disp);margin:0;letter-spacing:-.01em;text-transform:uppercase}
.entrada h1 em{font-style:normal;color:var(--sig)}
.entrada .intro p{margin:0;color:var(--on-navy2);max-width:42ch}
.fatos{display:flex;gap:26px;flex-wrap:wrap;margin-top:4px}
.fatos b{font:700 30px/1 var(--f-disp);display:block;color:#fff}
.fatos span{font-size:12px;color:var(--on-navy2)}
.entrada .intro .ilu{margin-top:auto;max-width:460px}
.entrada .intro{--ilu-a:#0A1726;--ilu-c:#2B4863;--ilu-c2:#3E6080;--ilu-d:#E9F0F5;--ilu-e:#35536F}
.entrada .acesso{padding:36px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.entrada .acesso h2{font:700 30px/1.05 var(--f-disp);margin:0;text-transform:uppercase;letter-spacing:.01em}
.passo-ind{display:flex;gap:6px}.passo-ind i{height:4px;flex:1;border-radius:4px;background:var(--line)}.passo-ind i.on{background:var(--sig)}
.link{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* painel */
.saud{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;background:var(--paper);border-radius:22px;padding:24px 28px;box-shadow:var(--sh);margin-bottom:26px}
.anel{width:108px;height:108px;position:relative}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .t{fill:none;stroke:var(--line);stroke-width:10}.anel .v{fill:none;stroke:var(--go2);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.anel b{position:absolute;inset:0;display:grid;place-items:center;font:800 30px var(--f-disp)}
.saud h2{font:700 34px/1 var(--f-disp);margin:4px 0 6px;text-transform:uppercase}
.saud p{margin:0;color:var(--ink2)}
.saud .mini{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.saud .mini b{color:var(--ink);font-variant-numeric:tabular-nums}
.proxima{background:var(--navy);color:var(--on-navy);border-radius:16px;padding:16px 18px;display:grid;gap:10px;min-width:230px}
.proxima small{color:var(--on-navy2);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.proxima b{font:700 20px/1.1 var(--f-disp);text-transform:uppercase}

.trilha{position:relative;display:grid;gap:18px;padding-left:64px}
.trilha::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:3px;background:repeating-linear-gradient(var(--line) 0 10px,transparent 10px 18px)}
.est{position:relative;display:grid;grid-template-columns:180px 1fr auto;gap:22px;align-items:center;background:var(--paper);border-radius:18px;padding:16px 20px 16px 16px;box-shadow:var(--sh);transition:transform .2s}
.est:not(.lock):hover{transform:translateX(4px)}
.est .no{position:absolute;left:-64px;top:50%;translate:0 -50%;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 22px var(--f-disp);background:var(--paper);color:var(--ink);box-shadow:0 0 0 3px var(--line);z-index:1}
.est.atual .no{background:var(--sig);color:var(--sig-ink);box-shadow:0 0 0 6px var(--sig-soft)}
.est.feito .no{background:var(--go);color:#fff;box-shadow:0 0 0 3px var(--go-soft)}
.est .thumb{background:var(--sunk);border-radius:12px;padding:8px 10px;aspect-ratio:240/150;max-width:100%}
.est .info{min-width:0}
.est h3{font:700 22px/1.08 var(--f-disp);margin:4px 0 6px;text-transform:uppercase;letter-spacing:.01em}
.est p{margin:0;color:var(--ink2);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font:600 12px/1 var(--f-body);padding:6px 10px;border-radius:999px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.go{background:var(--go-soft);color:var(--go)}.tag.sig{background:var(--sig-soft);color:var(--sig)}.tag.err{background:var(--err-soft);color:var(--err)}
.est.lock{box-shadow:none;background:transparent;outline:1.5px dashed var(--line);outline-offset:-1.5px}
.est.lock .thumb,.est.lock .info{opacity:.45;filter:grayscale(.6)}
.fita{position:absolute;right:18px;top:14px;font:700 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#1B1B1B;padding:7px 12px;border-radius:4px;background:repeating-linear-gradient(-45deg,#F4C21A 0 12px,#1B1B1B 12px 24px);}
.fita span{background:#F4C21A;padding:2px 6px;border-radius:2px}
.fim-ead{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:center;background:var(--go-soft);border-radius:18px;padding:18px 22px;margin-bottom:22px}
.fim-ead h3{margin:0;font:700 24px/1.1 var(--f-disp);text-transform:uppercase;color:var(--go)}
.fim-ead p{margin:4px 0 12px;color:var(--ink2)}
.acoes{display:flex;gap:10px;flex-wrap:wrap}

/* leitura */
.prog-top{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);height:4px;background:transparent;z-index:29}
.prog-top i{display:block;height:100%;width:0;background:var(--sig);transition:width .1s}
.voltar{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--ink2);font-weight:600;padding:0;margin-bottom:16px}
.leit{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.cab{display:grid;grid-template-columns:1fr 260px;gap:24px;align-items:center;background:var(--paper);border-radius:22px;padding:26px 28px;box-shadow:var(--sh);margin-bottom:22px}
.cab h1{font:800 clamp(32px,4.4vw,48px)/.95 var(--f-disp);margin:8px 0 10px;text-transform:uppercase}
.cab p{margin:0;color:var(--ink2);font-size:17px}
.cab .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.art{background:var(--paper);border-radius:22px;padding:30px 34px;box-shadow:var(--sh)}
.art>*{max-width:68ch}
.art h3{font:700 26px/1.1 var(--f-disp);text-transform:uppercase;margin:38px 0 12px;letter-spacing:.01em}
.art p{margin:0 0 14px}.art ul{padding-left:20px;margin:0 0 16px}.art li{margin-bottom:8px}
.art .lead{font-size:19px;line-height:1.55}
.dica{font-size:13px;color:var(--ink3);margin:-4px 0 12px!important}
.nota-lateral{border-left:4px solid var(--sig);background:var(--sig-soft);padding:14px 16px;border-radius:0 12px 12px 0;margin:18px 0}
.nota-lateral b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sig);margin-bottom:2px}
.duas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 18px;max-width:none!important}
.duas.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.bloco{background:var(--sunk);border-radius:14px;padding:14px 16px}
.bloco .etq,.etq{display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.bloco b{font:700 20px/1.1 var(--f-disp);text-transform:uppercase;display:block}
.bloco p{margin:6px 0 0;font-size:14px;color:var(--ink2)}
details.acc{border-bottom:1px solid var(--line)}
details.acc summary{list-style:none;cursor:pointer;padding:14px 4px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"+";font:700 22px/1 var(--f-disp);color:var(--sig);transition:transform .2s}
details.acc[open] summary::after{transform:rotate(45deg)}
details.acc p{margin:0 4px 14px;color:var(--ink2)}
.chips-lista{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;max-width:none!important}
.chips-lista span{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.escada{display:grid;gap:10px;margin:16px 0}
.escada div{background:var(--sunk);border-radius:14px;padding:14px 16px}
.escada div:nth-child(2){margin-left:22px}.escada div:nth-child(3){margin-left:44px}.escada div:nth-child(4){margin-left:66px}
.escada .mono{color:var(--sig);font-weight:500}
.escada b{display:block;font:700 20px/1.15 var(--f-disp);text-transform:uppercase;margin-top:2px}
.escada p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.numeros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 18px}
.numeros div{border:1.5px solid var(--line);border-radius:14px;padding:16px}
.numeros b{display:block;font:800 34px/1 var(--f-disp);color:var(--sig);margin-bottom:6px}
.numeros span{font-size:14px;color:var(--ink2)}
.tabela{overflow-x:auto;margin:12px 0 18px;max-width:none!important}
.tabela table{width:100%;border-collapse:collapse;font-size:15px;min-width:420px}
.tabela th{text-align:left;font:600 12px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:10px 12px;border-bottom:2px solid var(--ink)}
.tabela td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.cor{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.flips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:10px 0 18px;max-width:none!important}
.flips.dois{grid-template-columns:repeat(2,minmax(0,1fr))}
.flip{position:relative;min-height:130px;border:0;padding:0;background:none;perspective:900px;text-align:left}
.flip span{position:absolute;inset:0;border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;backface-visibility:hidden;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.flip .fr{background:var(--navy);color:var(--on-navy);font:700 24px/1 var(--f-disp);text-transform:uppercase}
.flip .fr small{font:500 12px/1.3 var(--f-body);text-transform:none;color:var(--on-navy2);margin-bottom:auto}
.flip .fr::after{content:"↻";position:absolute;right:14px;top:12px;font:600 16px var(--f-body);color:var(--sig)}
.flip .bk{background:var(--sig-soft);color:var(--ink);transform:rotateY(180deg);font-size:15px;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--sig)}
.flip.on .fr{transform:rotateY(-180deg)}.flip.on .bk{transform:rotateY(0)}
.bird{display:grid;gap:10px;margin:8px 0 14px}
.bird-p{display:grid;justify-items:center;gap:4px}
.bird-p button{width:var(--w);border:0;border-radius:6px;padding:10px;font:800 22px/1 var(--f-disp);color:#fff;background:var(--navy2);transition:transform .15s,background .15s}
.bird-p button:nth-child(1){background:var(--sig);color:var(--sig-ink)}
.bird-p button:hover,.bird-p button.on{transform:scale(1.03)}
.bird-p button.on{outline:3px solid var(--sig);outline-offset:2px}
.bird-t{text-align:center;margin:0!important;color:var(--ink2);font-weight:600;min-height:1.6em}
.iceberg{border-radius:14px;overflow:hidden;margin:12px 0 18px}
.iceberg .topo{background:var(--sunk);padding:14px 16px}
.iceberg .fundo{background:var(--navy);color:var(--on-navy);padding:22px 16px 26px}
.iceberg .fundo .etq{color:var(--on-navy2)}
.fluxo{display:flex;gap:6px;margin:4px 0 18px;flex-wrap:wrap}
.fluxo span{flex:1;min-width:110px;text-align:center;background:var(--sunk);padding:10px 8px;font:700 17px/1 var(--f-disp);text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
.fluxo span:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.mapa{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:center;margin:10px 0 16px;max-width:none!important}
.mapa svg{width:100%;height:auto}
.mapa .pl-bg{fill:var(--sunk);stroke:var(--line);stroke-width:2}.mapa .pl-ln{stroke:var(--ink3);stroke-width:2}.mapa .pl-mq{fill:var(--line)}
.mapa .pl-tx{font:600 8px var(--f-body);fill:var(--ink3);letter-spacing:.08em}
.mapa circle{cursor:pointer;stroke:var(--paper);stroke-width:3;transition:transform .2s;transform-box:fill-box;transform-origin:center}
.mapa circle:hover,.mapa circle.on{transform:scale(1.18)}
.mapa-info{background:var(--sunk);border-radius:14px;padding:16px;min-height:120px}
.mapa-info b{display:block;font:700 22px/1.1 var(--f-disp);text-transform:uppercase;margin-bottom:6px}
.mapa-info span{color:var(--ink2);font-size:14px}
.medidor{background:var(--sunk);border-radius:14px;padding:16px;margin:10px 0 16px}
.md-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.md-top b{font:800 30px var(--f-disp);font-variant-numeric:tabular-nums}
.medidor input{width:100%;accent-color:var(--sig);margin:10px 0 6px}
.md-bar{position:relative;height:10px;border-radius:10px;background:linear-gradient(90deg,var(--go2) 0 50%,var(--warn) 50% 70%,var(--err) 70%)}
.md-bar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--ink);transition:left .1s}
.md-bar em{position:absolute;top:14px;translate:-50% 0;font:500 11px var(--f-mono);font-style:normal;color:var(--ink3)}
.medidor p{margin:22px 0 0!important;font-size:14px;font-weight:600}
.hier{display:grid;gap:6px;margin:10px 0 18px}
.hier details{background:var(--navy);color:var(--on-navy);border-radius:10px}
.hier details:nth-child(2){margin-inline:3%}.hier details:nth-child(3){margin-inline:6%}.hier details:nth-child(4){margin-inline:9%}.hier details:nth-child(5){margin-inline:12%;background:var(--sig);color:var(--sig-ink)}
.hier summary{list-style:none;cursor:pointer;padding:12px 14px;font:700 19px/1 var(--f-disp);text-transform:uppercase;display:flex;align-items:center;gap:12px}
.hier summary::-webkit-details-marker{display:none}
.hier summary i{font-style:normal;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:15px}
.hier details p{margin:0!important;padding:0 14px 12px 52px;font-size:14px;opacity:.9}
.calc{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:end;background:var(--sunk);border-radius:14px;padding:16px;margin:12px 0 16px}
.calc label{grid-column:1/-1;font-weight:600}
.calc input{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font:700 20px var(--f-body);width:100%}
.calc-r{text-align:right}.calc-r b{display:block;font:800 36px/1 var(--f-disp);color:var(--go)}.calc-r span{font-size:13px;color:var(--ink2)}
ul.check{list-style:none;padding:0}
ul.check li{padding-left:30px;position:relative}
ul.check li::before{content:"✓";position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:6px;background:var(--go);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center}
.passos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:12px 0 18px;max-width:none!important}
.passos div{background:var(--sunk);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.passos i{font:800 28px/1 var(--f-disp);font-style:normal;color:var(--sig)}
.passos b{font:700 18px/1.1 var(--f-disp);text-transform:uppercase}
.passos span{font-size:13px;color:var(--ink2)}
.canal{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:16px 18px;margin:12px 0}
.canal .etq{color:var(--on-navy2)}.canal b{font-size:18px}
.reflita{margin:30px 0 4px;border-radius:16px;padding:18px;background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--line)}
.reflita::before{content:"Para refletir";display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--sig);margin-bottom:6px}
.reflita .q-ref{font:700 20px/1.2 var(--f-disp);text-transform:uppercase}
.reflita textarea{margin-top:12px;min-height:90px;resize:vertical}
.reflita small{display:block;margin-top:6px;color:var(--ink3);font-size:12px}
.check-box{position:sticky;top:84px;background:var(--paper);border-radius:22px;padding:22px;box-shadow:var(--sh);display:grid;gap:16px}
.check-box h4{margin:0;font:700 22px/1 var(--f-disp);text-transform:uppercase}
.req{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px}
.req i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink3);font-style:normal;font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line)}
.req.ok i{background:var(--go);color:#fff;box-shadow:none}
.req b{display:block;font-size:15px}
.req .barra{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.req .barra span{display:block;height:100%;background:var(--go2);width:0;transition:width .5s}
.check-box .rel{font:500 13px var(--f-mono);color:var(--ink3);text-align:center}

/* prova */
.prova{max-width:760px;margin:0 auto}
.prova-top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.prova-top h2{font:800 32px/1 var(--f-disp);margin:6px 0 0;text-transform:uppercase}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:34px;height:34px;border-radius:10px;border:0;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);font:700 14px var(--f-body);color:var(--ink2)}
.dots button.resp{background:var(--navy);color:var(--on-navy);box-shadow:none}
.dots button.at{box-shadow:0 0 0 3px var(--sig)}
.qcard{background:var(--paper);border-radius:22px;padding:28px;box-shadow:var(--sh);animation:entra .28s ease}
@keyframes entra{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.qcard .num{font:500 13px var(--f-mono);color:var(--sig)}
.qcard h3{font:700 26px/1.15 var(--f-disp);margin:8px 0 20px;text-transform:none;letter-spacing:0}
.op{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:var(--sunk);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .15s,background .15s;font-size:16px}
.op:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.op i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--paper);font:800 18px var(--f-disp);font-style:normal;box-shadow:inset 0 0 0 1.5px var(--line)}
.op.sel{background:var(--sig-soft);box-shadow:inset 0 0 0 2px var(--sig)}
.op.sel i{background:var(--sig);color:var(--sig-ink);box-shadow:none}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.res{max-width:720px;margin:0 auto;background:var(--paper);border-radius:22px;box-shadow:var(--sh);padding:32px;text-align:center}
.gauge{width:220px;margin:0 auto;position:relative}
.gauge svg{width:100%;height:auto;display:block}
.gauge .g-t{fill:none;stroke:var(--line);stroke-width:16;stroke-linecap:round}
.gauge .g-v{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.gauge .g-m{stroke:var(--ink);stroke-width:3}
.gauge b{position:absolute;left:0;right:0;bottom:6px;font:800 64px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.res h2{font:800 34px/1 var(--f-disp);text-transform:uppercase;margin:14px 0 6px}
.res .erradas{text-align:left;background:var(--err-soft);border-radius:14px;padding:14px 18px;margin:18px 0;color:var(--ink)}
.res .erradas b{color:var(--err)}
.res .erradas li{margin:6px 0}

/* declaração tela */
.decl{background:var(--paper);max-width:820px;margin:0 auto;border-radius:18px;padding:40px;box-shadow:var(--sh)}
.decl h2{font:800 30px/1 var(--f-disp);text-transform:uppercase;margin:0 0 4px}
.decl table{width:100%;border-collapse:collapse;font-size:14px;margin:16px 0}
.decl th{text-align:left;font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);border-bottom:2px solid var(--ink);padding:8px}
.decl td{border-bottom:1px solid var(--line);padding:8px}

/* admin */
.adm-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.adm-top h1{font:800 38px/1 var(--f-disp);text-transform:uppercase;margin:0;flex:1;min-width:220px}
.adm-top input,.adm-top select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border-radius:16px;padding:16px 18px;box-shadow:var(--sh)}
.kpi b{display:block;font:800 40px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi.go b{color:var(--go)}.kpi.sig b{color:var(--sig)}
.tbl-w{background:var(--paper);border-radius:18px;box-shadow:var(--sh);overflow:auto;max-height:68vh}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
.tbl th{position:sticky;top:0;background:var(--paper);text-align:left;font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:12px;border-bottom:2px solid var(--ink);z-index:1}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover td{background:var(--sunk)}
.tbl .nm b{display:block}.tbl .nm small{color:var(--ink3)}
.cel{display:inline-grid;place-items:center;min-width:34px;height:28px;padding:0 6px;border-radius:8px;font:700 13px var(--f-body);font-variant-numeric:tabular-nums}
.cel.go{background:var(--go-soft);color:var(--go)}.cel.err{background:var(--err-soft);color:var(--err)}.cel.lendo{background:var(--warn-soft);color:var(--warn)}.cel.nd{color:var(--ink3)}
.cel sub{font-size:10px;margin-left:2px;opacity:.8}
.mbar{height:6px;border-radius:6px;background:var(--line);width:90px;overflow:hidden}.mbar span{display:block;height:100%;background:var(--go2)}
.gaveta{position:fixed;inset:0;z-index:50;background:rgba(6,14,22,.5);display:flex;justify-content:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.gaveta .pn{width:min(560px,100%);height:100%;background:var(--bg);overflow:auto;padding:22px;animation:desliza .25s ease}
@keyframes desliza{from{transform:translateX(40px)}}
.pn h2{font:800 30px/1 var(--f-disp);text-transform:uppercase;margin:0}
.pn section{background:var(--paper);border-radius:16px;padding:16px;margin-top:14px}
.pn section h4{margin:0 0 6px;font:700 18px/1.1 var(--f-disp);text-transform:uppercase}
.pn table{width:100%;border-collapse:collapse;font-size:13px}.pn td,.pn th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.ref-box{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px;white-space:pre-wrap}
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,14,22,.5);display:grid;place-items:center;padding:16px}
.modal .pn2{background:var(--paper);border-radius:20px;padding:24px;max-width:560px;width:100%;box-shadow:var(--sh)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--navy);color:var(--on-navy);padding:12px 18px;border-radius:12px;box-shadow:var(--sh);z-index:60;font-weight:600;animation:entra .25s}
#confete{position:fixed;inset:0;pointer-events:none;z-index:70}

@media (max-width:980px){
  .leit{grid-template-columns:1fr}
  .check-box{position:fixed;left:0;right:0;bottom:0;top:auto;border-radius:18px 18px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));grid-template-columns:1fr auto;gap:8px 12px;align-items:center;z-index:25}
  .check-box h4,.check-box .req,.check-box .rel{display:none}
  .check-box .curto{display:block!important;font-size:13px;color:var(--ink2)}
  main.lendo{padding-bottom:120px}
  .entrada{grid-template-columns:1fr}.entrada .intro .ilu{max-width:340px}
  .saud{grid-template-columns:auto 1fr}.proxima{grid-column:1/-1}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .passos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .est{grid-template-columns:1fr;gap:12px}.est .thumb{max-width:220px}
  .trilha{padding-left:52px}.trilha::before{left:18px}.est .no{left:-52px;width:40px;height:40px;font-size:18px;top:30px;translate:0 0}
  .fita{position:static;justify-self:start}
  .cab{grid-template-columns:1fr}.cab .ilu{max-width:240px}
  .art{padding:22px 18px}
  .grid2,.duas,.duas.tres,.flips,.flips.dois,.numeros,.mapa{grid-template-columns:1fr}
  .escada div{margin-left:0!important}
  .fim-ead{grid-template-columns:1fr}.fim-ead .ilu{max-width:120px}
  .userchip .nm{display:none}
  .modo{display:none}.bar .marca b{font-size:18px}
  .saud{grid-template-columns:1fr;gap:16px;padding:20px}.saud .anel{width:84px;height:84px}.saud .anel b{font-size:24px}.saud h2{font-size:30px}
  .entrada .intro,.entrada .acesso{padding:24px}
  .decl{padding:22px}
  .qcard{padding:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.bar,.noprint,.prog-top{display:none!important}body{background:#fff}main{padding:0}.decl{box-shadow:none}}

const DB = {
  fb: null,
  async init() {
    if (CONFIG.firebase) {
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
      await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
      firebase.initializeApp(CONFIG.firebase);
      this.fb = firebase.database();
      document.getElementById("modo").hidden = true;
    } else document.getElementById("modo").textContent = "modo teste";
  },
  _lsKey: k => "cipaEAD_" + k,
  async get(k) {
    if (this.fb) { const s = await this.fb.ref(CONFIG.firebasePath + "/participantes/" + k).get(); return s.val(); }
    try { return JSON.parse(localStorage.getItem(this._lsKey(k))); } catch (e) { return null; }
  },
  async set(k, v) {
    if (this.fb) return this.fb.ref(CONFIG.firebasePath + "/participantes/" + k).set(v);
    try { localStorage.setItem(this._lsKey(k), JSON.stringify(v)); const idx = JSON.parse(localStorage.getItem("cipaEAD__idx") || "[]"); if (!idx.includes(k)) { idx.push(k); localStorage.setItem("cipaEAD__idx", JSON.stringify(idx)); } } catch (e) {}
  },
  async del(k) {
    if (this.fb) return this.fb.ref(CONFIG.firebasePath + "/participantes/" + k).remove();
    try { localStorage.removeItem(this._lsKey(k)); const idx = JSON.parse(localStorage.getItem("cipaEAD__idx") || "[]").filter(x => x !== k); localStorage.setItem("cipaEAD__idx", JSON.stringify(idx)); } catch (e) {}
  },
  async all() {
    if (this.fb) { const s = await this.fb.ref(CONFIG.firebasePath + "/participantes").get(); return Object.values(s.val() || {}); }
    try { return JSON.parse(localStorage.getItem("cipaEAD__idx") || "[]").map(k => JSON.parse(localStorage.getItem(this._lsKey(k)))).filter(Boolean); } catch (e) { return []; }
  }
};
function loadScript(src) { return new Promise((ok, er) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = er; document.head.appendChild(s); }); }

  G: [31, 77, 58], AM: [201, 154, 0], MU: [94, 107, 100], _img: {},
  async carregarLogos() {
    for (const k of ["logoPrincipal", "logoParceiro"]) {
      const src = CONFIG[k]; if (!src || this._img[k]) continue;
      try {
        const data = src.startsWith("data:") ? src : await fetch(src).then(r => r.blob()).then(b => new Promise(ok => { const f = new FileReader(); f.onload = () => ok(f.result); f.readAsDataURL(b); }));
        const dim = await new Promise(ok => { const i = new Image(); i.onload = () => ok([i.naturalWidth, i.naturalHeight]); i.onerror = () => ok(null); i.src = data; });
        if (dim) this._img[k] = { data, r: dim[0] / dim[1], fmt: /image\/jpe?g/.test(data) ? "JPEG" : "PNG" };
      } catch (e) {}
    }
  },
  spaced(doc, txt, cx, y, cs) { doc.setCharSpace(cs); const w = doc.getTextWidth(txt) + cs * (txt.length - 1); doc.text(txt, cx - w / 2, y); doc.setCharSpace(0); },
  logo(doc, k, x, y, maxW, maxH, alinhar) {
    const L = this._img[k]; if (!L) return;
    let w = maxW, h = w / L.r; if (h > maxH) { h = maxH; w = h * L.r; }
    doc.addImage(L.data, L.fmt, alinhar === "r" ? x - w : x, y + (maxH - h) / 2, w, h);
  },

  async corrigir() {

  resultado(id, t, jaAprovado, erradas = []) {

    this.u = null; this.setUser();
    this.tela(`<section class="entrada" style="max-width:860px;margin:20px auto">
      <div class="intro" style="padding-bottom:30px"><span class="eyebrow">Área restrita</span><h1>Painel do<br><em>instrutor</em></h1><p>Acompanhe o progresso das turmas, lance a etapa presencial e baixe declarações e certificados.</p></div>
      <form class="acesso" id="fPin" novalidate><div><span class="eyebrow">Acesso</span><h2>Digite a senha</h2></div>
        <div class="campo"><label for="pin">Senha do painel</label><input type="password" id="pin" autocomplete="current-password"></div>
        <div id="pinMsg"></div><button class="btn" type="submit">Entrar ${ICO.seta}</button><button class="link" type="button" id="pinVolta">Voltar para o acesso do participante</button></form></section>`);
    $("#pin").focus();
    $("#pinVolta").onclick = () => { history.replaceState(null, "", location.pathname); this.login(); };
    $("#fPin").addEventListener("submit", e => { e.preventDefault(); if ($("#pin").value === CONFIG.pinAdmin) { this.admin = true; this.adminPainel(); } else { $("#pinMsg").innerHTML = `<div class="aviso err">Senha incorreta. A senha fica em CONFIG.pinAdmin, no início do arquivo.</div>`; $("#pin").select(); } });
  },
  async adminPainel() {
    if (!this.admin) return this.adminLogin();
    const L = (await DB.all()).sort((a, b) => a.nome.localeCompare(b.nome)); this._lista = L;
    const E = ETAPAS(), fE = this._fEmp || "", fT = this._fTur || "", busca = (this._busca || "").toLowerCase();
    const V = L.filter(u => this.noFiltro(u) && (!busca || u.nome.toLowerCase().includes(busca) || u.cpf.includes(soDig(busca) || "§")));
    const concl = V.filter(u => u.etapas?.final?.aprovado).length, certs = V.filter(PDF.temCert).length;
    const turmas = [...new Set([...TURMAS, ...L.map(u => u.turma)])], emps = [...new Set([...EMPRESAS.map(e => e.nome), ...L.map(empresaDe).filter(Boolean)])];
    this.tela(`
    <div class="adm-top"><h1>Painel do instrutor</h1>
      <input id="aBusca" placeholder="Buscar nome ou CPF" value="${esc(this._busca || "")}" aria-label="Buscar participante">
      <select id="fE" aria-label="Filtrar empresa"><option value="">Todas as empresas</option>${emps.map(t => `<option ${t === fE ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      ${turmas.length > 1 ? `<select id="fT" aria-label="Filtrar turma"><option value="">Todas as turmas</option>${turmas.map(t => `<option ${t === fT ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>` : ""}</div>
    <div class="acoes" style="margin-bottom:16px"><button class="btn sm" id="aPres">Lançar presencial</button><button class="btn sec sm" id="aDocs">${ICO.down} Baixar documentos</button><button class="btn lin sm" id="aCsv">Exportar CSV</button><button class="btn lin sm" id="aAtu">Atualizar</button><button class="btn lin sm" id="aSair">Sair</button></div>
    <div class="kpis"><div class="kpi"><b>${V.length}</b><span>participantes</span></div><div class="kpi sig"><b>${V.length - concl}</b><span>em andamento</span></div><div class="kpi go"><b>${concl}</b><span>concluíram o EAD</span></div><div class="kpi go"><b>${certs}</b><span>certificados liberados</span></div></div>
    <div class="tbl-w"><table class="tbl"><thead><tr><th>Participante</th><th>Progresso</th>${E.map(e => `<th title="${esc(e.titulo)}">${e.tipo === "mod" ? "M" + e.n : "Final"}</th>`).join("")}<th>Tempo</th><th>Presencial</th><th>Documentos</th></tr></thead><tbody>
    ${V.length ? V.map(u => { const ok = E.filter(e => u.etapas?.[e.id]?.aprovado).length;
      return `<tr data-cpf="${u.cpf}"><td class="nm"><b>${esc(u.nome)}</b><small>${fmtCpf(u.cpf)} · ${esc(empresaDe(u) || u.turma)}</small></td>
      <td><div class="mbar"><span style="width:${ok / E.length * 100}%"></span></div><small style="color:var(--ink3)">${ok}/${E.length}</small></td>
      ${E.map(e => { const s = u.etapas?.[e.id]; const n = s?.tentativas?.length; return `<td>${s?.aprovado ? `<span class="cel go">${s.melhor}${n > 1 ? `<sub>×${n}</sub>` : ""}</span>` : n ? `<span class="cel err">${s.tentativas.at(-1).nota}<sub>×${n}</sub></span>` : s?.tempoLeitura ? `<span class="cel lendo">lendo</span>` : `<span class="cel nd">—</span>`}</td>`; }).join("")}
      <td style="font-variant-numeric:tabular-nums">${fmtTempo(tempoTotal(u))}</td>
      <td>${u.presencial?.presente ? `<span class="cel ${+u.presencial.nota >= CONFIG.notaMinimaPresencial ? "go" : "err"}">${u.presencial.nota}</span>` : u.presencial ? `<span class="cel err">ausente</span>` : `<span class="cel nd">—</span>`}</td>
      <td style="white-space:nowrap">${PDF.temDecl(u) ? `<button class="btn lin sm" data-d="decl" data-c="${u.cpf}">Decl.</button>` : ""} ${PDF.temCert(u) ? `<button class="btn go sm" data-d="cert" data-c="${u.cpf}">Cert.</button>` : ""}</td></tr>`; }).join("")
      : `<tr><td colspan="${E.length + 5}" style="text-align:center;color:var(--ink3);padding:40px;cursor:default">Nenhum participante encontrado. Os cadastros aparecem aqui assim que alguém acessa a plataforma.</td></tr>`}</tbody></table></div>
    <p class="dica" style="margin-top:12px!important">Clique na linha para ver tentativas, respostas das reflexões e lançar a etapa presencial. Verde: aprovado · vermelho: última nota abaixo do mínimo · ×N: tentativas. Certificado de 20h: EAD concluído + presença + nota presencial ≥ ${CONFIG.notaMinimaPresencial},0.</p>`);
    let t; $("#aBusca").oninput = e => { clearTimeout(t); t = setTimeout(() => { this._busca = e.target.value; this.adminPainel().then(() => { const b = $("#aBusca"); b.focus(); b.setSelectionRange(b.value.length, b.value.length); }); }, 300); };
    $("#fE").onchange = e => { this._fEmp = e.target.value; this.adminPainel(); };
    const ft = $("#fT"); if (ft) ft.onchange = e => { this._fTur = e.target.value; this.adminPainel(); };
    $("#aPres").onclick = () => this.lancarPresencial(); $("#aDocs").onclick = () => this.docsLote(V); $("#aCsv").onclick = () => this.csv(V); $("#aAtu").onclick = () => this.adminPainel(); $("#aSair").onclick = () => this.sair();
    document.querySelectorAll("tr[data-cpf]").forEach(r => r.onclick = e => { if (e.target.closest("button")) return; this.detalhe(r.dataset.cpf); });
    document.querySelectorAll("[data-d]").forEach(b => b.onclick = () => this.baixar(b.dataset.d, b.dataset.c));
  },
  noFiltro(u) { return (!this._fEmp || empresaDe(u) === this._fEmp) && (!this._fTur || u.turma === this._fTur); },
  rotFiltro() { return [this._fEmp || "Todas as empresas", this._fTur].filter(Boolean).join(" · "); },
  detalhe(cpf) {
    const u = this._lista.find(x => x.cpf === cpf), E = ETAPAS();
    const g = document.createElement("div"); g.className = "gaveta"; g.onclick = e => e.target === g && g.remove();
    const refs = MODULOS.map(m => u.etapas?.[m.id]?.reflexao ? `<div><small class="eyebrow">Módulo ${m.n}</small><div class="ref-box">${esc(u.etapas[m.id].reflexao)}</div></div>` : "").join("");
    g.innerHTML = `<div class="pn"><div style="display:flex;gap:10px;align-items:start"><div style="flex:1"><span class="eyebrow">${esc(u.tipo)} · ${esc(empresaDe(u) || "sem empresa")} · ${esc(u.turma)}</span><h2>${esc(u.nome)}</h2><small style="color:var(--ink2)">${fmtCpf(u.cpf)} · ${esc(u.matricula || "sem matrícula")} · ${esc(u.funcao || "função não informada")}<br>Cadastro ${fmtData(u.criadoEm)} · Última atividade ${fmtData(u.atualizadoEm)}</small></div><button class="btn lin sm" id="gX">Fechar</button></div>
      <div class="acoes" style="margin-top:14px">${PDF.temDecl(u) ? `<button class="btn go sm" id="gD">${ICO.down} Declaração EAD</button>` : ""}${PDF.temCert(u) ? `<button class="btn sm" id="gC">${ICO.down} Certificado 20h</button>` : ""}</div>
      <section><h4>Empresa</h4><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"><select id="gEmp" style="flex:1;min-width:200px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper)" aria-label="Empresa do participante">${[...new Set([...EMPRESAS.map(e => e.nome), empresaDe(u)].filter(Boolean))].map(n => `<option ${n === empresaDe(u) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select><button class="btn sec sm" id="gEmpS">Corrigir empresa</button></div></section>
      <section><h4>Etapa presencial · 8h</h4>
        <div class="grid2" style="margin-top:8px"><div class="campo"><label for="pData">Data</label><input type="date" id="pData" value="${u.presencial?.data || ""}"></div><div class="campo"><label for="pNota">Nota da prova (0 a 10)</label><input type="number" id="pNota" min="0" max="10" step="0.5" value="${u.presencial?.nota ?? ""}"></div>
        <div class="campo"><label for="pLocal">Local</label><input id="pLocal" value="${esc(u.presencial?.local || localDe(u))}"></div><div class="campo"><label for="pPres">Presença</label><select id="pPres"><option value="1" ${u.presencial?.presente !== false ? "selected" : ""}>Presente (8h)</option><option value="0" ${u.presencial?.presente === false ? "selected" : ""}>Ausente</option></select></div></div>
        <div id="pMsg" style="margin-top:10px"></div><button class="btn sec sm" id="pSalvar" style="margin-top:10px">Salvar etapa presencial</button></section>
      ${refs ? `<section><h4>Reflexões do participante</h4>${refs}</section>` : ""}
      ${E.map(e => { const s = u.etapas?.[e.id]; return `<section><h4>${e.tipo === "mod" ? "M" + e.n + " · " : ""}${esc(e.curto || e.titulo)} ${s?.aprovado ? `<span class="tag go">aprovado</span>` : ""}</h4><small style="color:var(--ink2)">Leitura ${fmtTempo(s?.tempoLeitura)} · Em avaliação ${fmtTempo(s?.tempoProva)}</small>
        ${s?.tentativas?.length ? `<table style="margin-top:6px"><tr><th>#</th><th>Data</th><th>Acertos</th><th>Nota</th></tr>${s.tentativas.map((t, k) => `<tr><td>${k + 1}</td><td>${fmtData(t.data)}</td><td>${t.acertos}/${t.total}</td><td><b style="color:var(${t.nota >= CONFIG.notaMinima ? "--go" : "--err"})">${t.nota}</b></td></tr>`).join("")}</table>` : `<div style="font-size:13px;color:var(--ink3)">Sem tentativas.</div>`}</section>`; }).join("")}
      <section><h4>Excluir participante</h4><p style="margin:0 0 10px;font-size:14px;color:var(--ink2)">Remove o cadastro e todo o progresso. Não é possível desfazer.</p><button class="btn danger sm" id="gR">Excluir participante</button></section></div>`;
    document.body.appendChild(g);
    const on = (s, f) => { const b = g.querySelector(s); if (b) b.onclick = f; };
    on("#gX", () => g.remove()); on("#gD", () => this.baixar("decl", u.cpf)); on("#gC", () => this.baixar("cert", u.cpf));
    on("#gR", async () => { const b = g.querySelector("#gR"); if (!b.dataset.conf) { b.dataset.conf = 1; b.textContent = "Clique de novo para confirmar"; return; } await DB.del(u.cpf); g.remove(); toast("Participante excluído"); this.adminPainel(); });
    on("#gEmpS", async () => { u.empresa = g.querySelector("#gEmp").value; await DB.set(u.cpf, u); g.remove(); toast("Empresa atualizada"); await this.adminPainel(); this.detalhe(u.cpf); });
    on("#pSalvar", async () => {
      const data = g.querySelector("#pData").value, nota = g.querySelector("#pNota").value, pres = g.querySelector("#pPres").value === "1", m = t => g.querySelector("#pMsg").innerHTML = `<div class="aviso err">${t}</div>`;
      if (!data) return m("Informe a data do encontro presencial.");
      if (pres && (nota === "" || +nota < 0 || +nota > 10)) return m("Informe a nota da prova presencial, de 0 a 10.");
      u.presencial = { data, nota: pres ? +nota : null, presente: pres, local: g.querySelector("#pLocal").value.trim() || localDe(u), lancadoEm: new Date().toISOString() };
      await DB.set(u.cpf, u); g.remove(); toast("Etapa presencial salva"); await this.adminPainel(); this.detalhe(u.cpf);
    });
  },
  async baixar(tipo, cpf) {
    const u = cpf ? (this._lista || []).find(x => x.cpf === cpf) || await DB.get(cpf) : this.u;
    toast("Gerando PDF...");
    try { await PDF.um(tipo, u); } catch (e) { toast("Não foi possível gerar o PDF. Verifique a internet."); }
  },
  docsLote(V) {
    const nd = V.filter(PDF.temDecl).length, nc = V.filter(PDF.temCert).length;
    const d = document.createElement("div"); d.className = "modal"; d.onclick = e => e.target === d && d.remove();
    d.innerHTML = `<div class="pn2"><span class="eyebrow">${esc(this.rotFiltro())}${this._busca ? " · busca: " + esc(this._busca) : ""}</span><h2 style="font:800 30px/1 var(--f-disp);text-transform:uppercase;margin:4px 0 8px">Baixar documentos</h2>
      <p style="color:var(--ink2);font-size:14px;margin:0 0 16px">ZIP: um PDF por participante, com o nome no arquivo. PDF único: todos em sequência, pronto para imprimir.</p>
      <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi go"><b>${nd}</b><span>declarações EAD</span></div><div class="kpi go"><b>${nc}</b><span>certificados 20h</span></div></div>
      <b>Declarações EAD</b><div class="acoes" style="margin:8px 0 16px"><button class="btn sm" data-t="decl" data-m="zip" ${nd ? "" : "disabled"}>ZIP</button><button class="btn lin sm" data-t="decl" data-m="pdf" ${nd ? "" : "disabled"}>PDF único</button></div>
      <b>Certificados 20h</b><div class="acoes" style="margin:8px 0 16px"><button class="btn sm" data-t="cert" data-m="zip" ${nc ? "" : "disabled"}>ZIP</button><button class="btn lin sm" data-t="cert" data-m="pdf" ${nc ? "" : "disabled"}>PDF único</button></div>
      <div id="lMsg"></div><div style="text-align:right;margin-top:8px"><button class="btn lin sm" id="xL">Fechar</button></div></div>`;
    document.body.appendChild(d); d.querySelector("#xL").onclick = () => d.remove();
    d.querySelectorAll("[data-t]").forEach(b => b.onclick = async () => {
      d.querySelector("#lMsg").innerHTML = `<div class="aviso in">Gerando arquivos...</div>`;
      try { const n = await PDF.lote(b.dataset.t, V, b.dataset.m); d.querySelector("#lMsg").innerHTML = `<div class="aviso ok">${n} documento(s) gerado(s).</div>`; }
      catch (e) { d.querySelector("#lMsg").innerHTML = `<div class="aviso err">Não foi possível gerar. Verifique a internet.</div>`; }
    });
  },
  lancarPresencial() {
    const V = this._lista.filter(u => this.noFiltro(u) && u.etapas?.final?.aprovado);
    this.tela(`<button class="voltar" id="lpV">${ICO.volta} Painel</button>
    <div class="adm-top"><h1>Lançar etapa presencial</h1></div>
    <p style="color:var(--ink2);margin:-8px 0 16px">Aparecem só os participantes que concluíram o EAD · ${esc(this.rotFiltro())}. Nota mínima para o certificado: ${CONFIG.notaMinimaPresencial},0.</p>
    <div class="grid2" style="max-width:640px;margin-bottom:16px"><div class="campo"><label for="lData">Data do encontro</label><input type="date" id="lData" value="${new Date().toISOString().slice(0, 10)}"></div><div class="campo"><label for="lLocal">Local</label><input id="lLocal" value="${esc(this._fEmp ? localEmp(this._fEmp) : CONFIG.local)}"></div></div>
    ${V.length ? `<div class="tbl-w"><table class="tbl" style="min-width:560px"><thead><tr><th>Presente</th><th>Participante</th><th style="width:160px">Nota (0 a 10)</th></tr></thead><tbody>
      ${V.map(u => `<tr style="cursor:default"><td><input type="checkbox" data-c="${u.cpf}" ${u.presencial?.presente !== false ? "checked" : ""} style="width:22px;height:22px;accent-color:var(--go)" aria-label="Presença de ${esc(u.nome)}"></td><td class="nm"><b>${esc(u.nome)}</b><small>${fmtCpf(u.cpf)} · ${esc(u.turma)}</small></td><td><input type="number" min="0" max="10" step="0.5" data-n="${u.cpf}" value="${u.presencial?.nota ?? ""}" style="width:100%;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper)" aria-label="Nota de ${esc(u.nome)}"></td></tr>`).join("")}</tbody></table></div>
      <div id="lpMsg" style="margin-top:12px"></div><button class="btn" id="lpSalvar" style="margin-top:12px">Salvar lançamentos</button>` : `<div class="aviso in">Ninguém concluiu a etapa EAD neste filtro ainda.</div>`}`);
    $("#lpV").onclick = () => this.adminPainel();
    const b = $("#lpSalvar"); if (!b) return;
    b.onclick = async () => {
      const data = $("#lData").value, local = $("#lLocal").value.trim() || CONFIG.local;
      if (!data) return $("#lpMsg").innerHTML = `<div class="aviso err">Informe a data do encontro.</div>`;
      const bad = V.filter(u => { const n = document.querySelector(`[data-n="${u.cpf}"]`).value; return document.querySelector(`[data-c="${u.cpf}"]`).checked && (n === "" || +n < 0 || +n > 10); });
      if (bad.length) return $("#lpMsg").innerHTML = `<div class="aviso err">Falta a nota de: ${bad.map(u => esc(u.nome.split(" ")[0])).join(", ")}.</div>`;
      for (const u of V) { const pres = document.querySelector(`[data-c="${u.cpf}"]`).checked, n = document.querySelector(`[data-n="${u.cpf}"]`).value; u.presencial = { data, local, presente: pres, nota: pres ? +n : null, lancadoEm: new Date().toISOString() }; await DB.set(u.cpf, u); }
      toast("Lançamentos salvos"); this.adminPainel();
    };
  },
  csv(V) {
    const E = ETAPAS();
    const head = ["Nome", "CPF", "Matrícula", "Função", "Tipo", "Empresa", "Turma", ...E.flatMap(e => { const c = e.tipo === "mod" ? "M" + e.n : "Final"; return [c + " nota", c + " tentativas", c + " aprovação", c + " tempo (min)"]; }), "Tempo total (min)", "Concluído em", "Presencial data", "Presencial presença", "Presencial nota", "Certificado liberado", ...MODULOS.map(m => "Reflexão M" + m.n)];
    const rows = V.map(u => { let tt = 0; return [u.nome, fmtCpf(u.cpf), u.matricula, u.funcao, u.tipo, empresaDe(u), u.turma, ...E.flatMap(e => { const s = u.etapas?.[e.id] || {}; const tm = Math.round(((s.tempoLeitura || 0) + (s.tempoProva || 0)) / 60); tt += tm; return [s.aprovado ? s.melhor : (s.tentativas?.at(-1)?.nota ?? ""), s.tentativas?.length || 0, s.aprovadoEm ? fmtData(s.aprovadoEm) : "", tm]; }), tt, u.concluidoEm ? fmtData(u.concluidoEm) : "", u.presencial?.data || "", u.presencial ? (u.presencial.presente ? "Presente" : "Ausente") : "", u.presencial?.nota ?? "", PDF.temCert(u) ? "Sim" : "Não", ...MODULOS.map(m => u.etapas?.[m.id]?.reflexao || "")]; });
    const csv = "﻿" + [head, ...rows].map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = `CIPA_EAD_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  }
};
window.addEventListener("beforeunload", () => App.pararTimer());
App.start();

</script>
</body>
</html>
